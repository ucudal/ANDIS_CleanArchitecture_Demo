name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Generate bearer token
        run: |
          token=$(dotnet user-jwts create \
            --project ./src/TaskManagement.API/TaskManagement.API.csproj \
            --audience https://localhost:5001 \
            --audience http://localhost:5000 \
            --claim nameid=11111111-1111-1111-1111-111111111111 \
            --claim name=ci-user \
            --output token)
          echo "::add-mask::$token"
          echo "BEARER_TOKEN=$token" >> "$GITHUB_ENV"

      # Incluye las pruebas de arquitectura, que verifican la regla de dependencias.
      - name: Test
        run: dotnet test --no-restore
